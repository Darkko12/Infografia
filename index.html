<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infografía interactiva · ChatGPT</title>
  <meta name="description" content="Infografía interactiva sobre la expansión de ChatGPT y la complacencia de la IA." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="stage">
    <main id="app" aria-live="polite"></main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function(){
      var CW = 1600, CH = 900; // tamaño fijo de diseño (lienzo)
      var stage = document.getElementById('stage');
      function fit(){
        var s = Math.min(window.innerWidth / CW, window.innerHeight / CH);
        stage.style.transform = 'scale(' + s + ')';
      }
      addEventListener('resize', fit);
      addEventListener('load', fit);
      fit();
    })();
  </script>
</body>
</html>
